server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: reliefhub-backend

  datasource:
    url: jdbc:mysql://localhost:3306/reliefhub?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

# ─── JWT Configuration ───────────────────────────────────
app:
  jwt:
    secret: "ReliefHubSecretKey2026ForJWTTokenGenerationAndValidationThisKeyIsLongEnoughForHS512Algorithm"
    expiration-ms: 86400000          # 24 hours
    refresh-expiration-ms: 604800000  # 7 days
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  upload:
    dir: uploads
    max-size-mb: 10

# ─── Springdoc / Swagger ─────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.reliefhub: INFO
    org.hibernate.SQL: WARN
